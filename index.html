<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>I'm Sorry Vanshu</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,
body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:black;

    -webkit-user-select:none;
    user-select:none;

    touch-action:manipulation;
}

/* WRAPPER */
.wrapper{
    position:fixed;
    inset:0;

    width:100%;
    height:100%;

    display:flex;
    align-items:center;
    justify-content:center;

    background:black;

    opacity:0;
    transition:opacity 0.8s ease;
}

/* VIDEO */
video{
    position:absolute;
    inset:0;

    width:100%;
    height:100%;

    object-fit:cover;
    object-position:center;

    background:black;

    transform:translateZ(0);
    backface-visibility:hidden;

    z-index:1;
}

/* OVERLAY */
.overlay{
    position:absolute;
    inset:0;

    background:radial-gradient(
        circle,
        rgba(0,0,0,0.15),
        rgba(0,0,0,0.75)
    );

    z-index:2;
}

/* CONTENT */
.content{
    position:absolute;
    inset:0;

    display:flex;
    flex-direction:column;

    align-items:center;
    justify-content:center;

    text-align:center;
    padding:30px;

    color:white;

    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;

    text-shadow:0 2px 12px rgba(0,0,0,0.9);

    z-index:3;
}

.content h1{
    font-size:3rem;
    margin-bottom:14px;
}

.content p{
    font-size:1.2rem;
    line-height:1.6;
}

/* TAP MESSAGE */
.tap-message{
    position:absolute;
    bottom:28px;
    left:50%;
    transform:translateX(-50%);

    color:white;
    font-size:14px;

    opacity:0.7;

    animation:pulse 2s infinite;

    z-index:5;
}

@keyframes pulse{
    0%{opacity:0.3;}
    50%{opacity:0.9;}
    100%{opacity:0.3;}
}

/* MOBILE */
@media(max-width:768px){
    .content h1{font-size:2.1rem;}
    .content p{font-size:1rem;}
}

</style>
</head>

<body>

<div class="wrapper">

    <video
        id="video"
        muted
        autoplay
        loop
        playsinline
        webkit-playsinline
        x5-playsinline
        preload="auto"
        poster="poster.jpg">

        <source src="final.mp4" type="video/mp4">

    </video>

    <div class="overlay"></div>

    <div class="content">

        <h1>I'm Sorry</h1>

        <p>I know I hurt you.</p>

        <p>And I regret it deeply.</p>

    </div>

    <div class="tap-message">
        Tap anywhere if video doesn't start
    </div>

</div>

<script>

const video = document.getElementById("video");
const wrapper = document.querySelector(".wrapper");

let started = false;

/* SHOW PAGE */
function showPage(){
    wrapper.style.opacity = "1";
}

/* START VIDEO */
async function startVideo(){

    if(started) return;

    try{

        video.muted = true;

        const playPromise = video.play();

        if(playPromise !== undefined){
            await playPromise;
        }

        started = true;
        showPage();

    }catch(e){

        showPage();

    }
}

/* LOAD FIX */
window.addEventListener("load", () => {

    video.load();

    setTimeout(() => {
        startVideo();
    }, 300);

});

/* READY FIX */
video.addEventListener("loadeddata", () => {

    startVideo();

});

/* USER INTERACTION FIX (INSTAGRAM) */
function userStart(){
    startVideo();
}

document.addEventListener("touchstart", userStart, { once:true });
document.addEventListener("click", userStart, { once:true });

/* RESUME IF PAUSED */
document.addEventListener("visibilitychange", () => {

    if(!document.hidden && video.paused){
        video.play().catch(()=>{});
    }

});

/* FORCE PLAY LOOP (INSTAGRAM WEBVIEW BUG FIX) */
setInterval(() => {

    if(!document.hidden && video.paused){
        video.play().catch(()=>{});
    }

}, 1500);

</script>

</body>
</html>

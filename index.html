<script>
const reels = document.querySelectorAll(".reel");

let currentIndex = 0;
let isUserInteracting = false;

// smoother + mobile-safe scroll
function goToReel(index) {
    const target = reels[index];

    window.scrollTo({
        top: target.offsetTop,
        behavior: "smooth"
    });
}

// detect current visible reel properly
function getCurrentReelIndex() {
    let closestIndex = 0;
    let minDistance = Infinity;

    reels.forEach((reel, i) => {
        const rect = reel.getBoundingClientRect();
        const distance = Math.abs(rect.top);

        if (distance < minDistance) {
            minDistance = distance;
            closestIndex = i;
        }
    });

    return closestIndex;
}

// auto next reel
function nextReel() {
    if (isUserInteracting) return;

    currentIndex = getCurrentReelIndex();
    currentIndex++;

    if (currentIndex >= reels.length) {
        currentIndex = 0;
    }

    goToReel(currentIndex);
}

// user interaction detection (mobile-safe)
["touchstart", "scroll", "keydown"].forEach(evt => {
    window.addEventListener(evt, () => {
        isUserInteracting = true;

        // re-enable after 5s idle
        clearTimeout(window._resumeTimer);
        window._resumeTimer = setTimeout(() => {
            isUserInteracting = false;
        }, 5000);
    }, { passive: true });
});

// FIRST VIDEO logic
const firstVideo = document.getElementById("firstVideo");

firstVideo.addEventListener("loadedmetadata", () => {
    firstVideo.play();

    firstVideo.addEventListener("ended", () => {
        goToReel(1);
        currentIndex = 1;
    });
});

// auto play loop
setTimeout(() => {
    setInterval(nextReel, 4500);
}, 2000);
</script>

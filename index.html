<!DOCTYPE html>
<html lang="en">
<head>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>I'm Sorry Vanshu</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:'Inter', sans-serif;
    background:black;
    overflow-y:scroll;
    scroll-snap-type:y mandatory;
    scroll-behavior:smooth;
    overscroll-behavior-y:none;
    -webkit-overflow-scrolling: touch;
}

/* REELS */
.reel{
    position:relative;
    height:100vh;
    width:100%;
    scroll-snap-align:start;
    scroll-snap-stop:always;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;

    opacity:0;
    transition: opacity 0.8s ease;
}

.reel-active{
    opacity:1;
}

/* MEDIA */
.reel video,
.reel img{
    position:absolute;
    top:0;
    left:0;
    width:100%;
    height:100%;
    object-fit:cover;
    z-index:-2;

    transform:scale(1.1);
    animation:slowZoom 12s ease-in-out infinite alternate;
}

@keyframes slowZoom{
    from{ transform:scale(1.1); }
    to{ transform:scale(1.2); }
}

/* OVERLAY */
.reel::after{
    content:'';
    position:absolute;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background: radial-gradient(circle, rgba(0,0,0,0.2), rgba(0,0,0,0.75));
    z-index:-1;
}

/* TEXT */
.content{
    color:white;
    text-align:center;
    padding:25px;
    max-width:90%;
    text-shadow:0 2px 12px rgba(0,0,0,0.8);
    animation:fadeUp 1s ease;
}

.content h1{
    font-size:3.8rem;
    font-weight:600;
}

.content p{
    font-size:1.5rem;
}

@keyframes fadeUp{
    from{opacity:0; transform:translateY(30px);}
    to{opacity:1; transform:translateY(0);}
}

.end-content{
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:12px;
}

@media(max-width:768px){
    .content h1{font-size:2.6rem;}
    .content p{font-size:1.2rem;}
}

</style>
</head>

<body>

<div class="reel reel-active">
    <video id="firstVideo" muted playsinline autoplay loop preload="auto">
        <source src="Memory1.mp4" type="video/mp4">
    </video>

    <div class="content">
        <h1>I'm Sorry</h1>
        <p>I know I hurt you.</p>
        <p>And I regret it deeply.</p>
    </div>
</div>

<div class="reel"><img src="1.jpeg"><div class="content"><p>Every picture reminds me of you.</p></div></div>
<div class="reel"><img src="2.jpeg"><div class="content"><p>I wish I handled things better.</p></div></div>
<div class="reel"><img src="3.jpeg"><div class="content"><p>I never wanted to hurt you.</p></div></div>
<div class="reel"><img src="4.jpeg"><div class="content"><p>Every moment still stays with me.</p></div></div>
<div class="reel"><img src="5.jpeg"><div class="content"><p>I miss how things used to be.</p></div></div>
<div class="reel"><img src="6.jpeg"><div class="content"><p>I hope you’re doing okay.</p></div></div>

<div class="reel">
    <video id="lastVideo" muted playsinline autoplay loop preload="auto">
        <source src="memory3.mp4" type="video/mp4">
    </video>

    <div class="content end-content">
        <h1>If you ever feel like talking again…</h1>
        <p>I’ll be here.</p>
    </div>
</div>

<script>

const reels = document.querySelectorAll(".reel");
let currentIndex = 0;
let isUserInteracting = false;

/* activate reel */
function setActive(i){
    reels.forEach(r => r.classList.remove("reel-active"));
    reels[i].classList.add("reel-active");
}

/* scroll */
function goToReel(i){
    setActive(i);

    window.scrollTo({
        top: reels[i].offsetTop,
        behavior: "smooth"
    });
}

/* AUTO SCROLL (RESTORED CLEAN VERSION) */
function next(){
    if(isUserInteracting) return;

    currentIndex++;

    if(currentIndex >= reels.length){
        currentIndex = reels.length - 1; // stop at end
        return;
    }

    goToReel(currentIndex);
}

/* interval auto scroll */
setInterval(()=>{
    next();
}, 3200);

/* pause on touch */
window.addEventListener("touchstart", ()=>{
    isUserInteracting = true;
    setTimeout(()=> isUserInteracting=false, 4000);
}, {passive:true});

/* autoplay fix */
window.addEventListener("load", async ()=>{
    const v1 = document.getElementById("firstVideo");
    const v2 = document.getElementById("lastVideo");

    try{
        await v1.play();
        await v2.play();
    }catch(e){
        console.log("Autoplay blocked:", e);
    }

    setActive(0);
});

</script>

</body>
</html>

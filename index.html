<!DOCTYPE html>
<html lang="en">
<head>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>I'm Sorry Vanshu</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:'Inter', sans-serif;
    background:black;
    overflow-y:scroll;
    scroll-snap-type:y mandatory;
}

/* EACH REEL */
.reel{
    position:relative;
    height:100vh;
    width:100%;
    scroll-snap-align:start;
    scroll-snap-stop:always;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
}

/* VIDEO + IMAGE */
.reel video,
.reel img{
    position:absolute;
    top:0;
    left:0;
    width:100%;
    height:100%;
    object-fit:cover;
    z-index:-2;
    transform:scale(1.1);
    animation:slowZoom 12s ease-in-out infinite alternate;
}

/* zoom animation */
@keyframes slowZoom{
    from{ transform:scale(1.1); }
    to{ transform:scale(1.2); }
}

/* overlay */
.reel::after{
    content:'';
    position:absolute;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background: radial-gradient(
        circle at center,
        rgba(0,0,0,0.2),
        rgba(0,0,0,0.75)
    );
    z-index:-1;
}

/* TEXT */
.content{
    color:white;
    text-align:center;
    padding:20px;
    max-width:90%;
    opacity:0.9;
    letter-spacing:0.5px;
    animation:fadeUp 1.2s ease;
}

.content h1{
    font-size: 3.8rem;
    margin-bottom: 18px;
    letter-spacing: 1px;
}

.content p{
    font-size: 1.6rem;
    line-height: 1.8;
}

/* entry animation */
@keyframes fadeUp{
    from{
        opacity:0;
        transform:translateY(30px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}

/* last slide emphasis */
.reel:last-child::after{
    background:rgba(0,0,0,0.78);
}

.reel:last-child .content{
    transform:scale(1.05);
    opacity:1;
}

/* mobile */
@media(max-width:768px){
    .content h1{
        font-size: 2.6rem;
    }

    .content p{
        font-size: 1.2rem;
    }
}
</style>
</head>

<body>

<!-- REEL 1 -->
<div class="reel">
    <video autoplay muted loop playsinline>
        <source src="vdd.mp4" type="video/mp4">
    </video>
    <div class="content">
        <h1>I'm Sorry</h1>
        <p>I know I hurt you.</p>
        <p>And I regret it deeply.</p>
    </div>
</div>

<!-- REEL 2 -->
<div class="reel">
    <img src="1.jpeg">
    <div class="content">
        <p>Every picture reminds me of you.</p>
    </div>
</div>

<!-- REEL 3 -->
<div class="reel">
    <img src="2.jpeg">
    <div class="content">
        <p>I wish I handled things better.</p>
    </div>
</div>

<!-- REEL 4 -->
<div class="reel">
    <img src="3.jpeg">
    <div class="content">
        <p>I never wanted to hurt you.</p>
    </div>
</div>

<!-- REEL 5 -->
<div class="reel">
    <video autoplay muted loop playsinline>
        <source src="vdd.mp4" type="video/mp4">
    </video>
    <div class="content">
        <h1>If you ever feel like talking again…</h1>
        <p>I’ll be here.</p>
    </div>
</div>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>I'm Sorry Vanshu</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:'Inter', sans-serif;
    background:black;
    overflow-y:scroll;
    scroll-snap-type:y mandatory;
    scroll-behavior:smooth;
}

/* EACH REEL */
.reel{
    position:relative;
    height:100vh;
    width:100%;
    scroll-snap-align:start;
    scroll-snap-stop:always;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
}

/* VIDEO + IMAGE */
.reel video,
.reel img{
    position:absolute;
    top:0;
    left:0;
    width:100%;
    height:100%;
    object-fit:cover;
    z-index:-2;
    transform:scale(1.1);
    animation:slowZoom 12s ease-in-out infinite alternate;
}

/* FIX ONLY FOR 2.JPEG */
.reel.fit img{
    object-fit:contain;
    background:black;
    transform:none;
    animation:none;
}

@keyframes slowZoom{
    from{ transform:scale(1.1); }
    to{ transform:scale(1.2); }
}

.reel::after{
    content:'';
    position:absolute;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background: radial-gradient(
        circle at center,
        rgba(0,0,0,0.2),
        rgba(0,0,0,0.75)
    );
    z-index:-1;
}

.content{
    color:white;
    text-align:center;
    padding:25px;
    max-width:90%;
    opacity:0.95;
    letter-spacing:0.5px;

    background: rgba(0,0,0,0.25);
    backdrop-filter: blur(6px);
    border-radius: 12px;

    animation:fadeUp 1.2s ease;
}

@keyframes fadeUp{
    from{ opacity:0; transform:translateY(30px); }
    to{ opacity:1; transform:translateY(0); }
}

.reel:last-child::after{
    background:rgba(0,0,0,0.78);
}

.reel:last-child .content{
    transform:scale(1.05);
    opacity:1;
}

@media(max-width:768px){
    .content h1{ font-size:2.6rem; }
    .content p{ font-size:1.2rem; }
}
</style>
</head>

<body>

<!-- REELS -->

<div class="reel" id="firstReel">
    <video id="firstVideo" autoplay muted playsinline preload="auto">
        <source src="Memory1.mp4">
    </video>

    <div class="content">
        <h1>I'm Sorry</h1>
        <p>I know I hurt you.</p>
        <p>And I regret it deeply.</p>
    </div>
</div>

<div class="reel">
    <img src="1.jpeg" alt="">
    <div class="content">
        <p>Every picture reminds me of you.</p>
    </div>
</div>

<div class="reel fit">
    <img src="2.jpeg" alt="">
    <div class="content">
        <p>I wish I handled things better.</p>
    </div>
</div>

<div class="reel">
    <img src="3.jpeg" alt="">
    <div class="content">
        <p>I never wanted to hurt you.</p>
    </div>
</div>

<div class="reel">
    <img src="4.jpeg" alt="">
    <div class="content">
        <p>Every moment still stays with me.</p>
    </div>
</div>

<div class="reel">
    <img src="5.jpeg" alt="">
    <div class="content">
        <p>I miss how things used to be.</p>
    </div>
</div>

<div class="reel">
    <img src="6.jpeg" alt="">
    <div class="content">
        <p>I hope you’re doing okay.</p>
    </div>
</div>

<div class="reel">
    <video autoplay muted loop playsinline preload="auto">
        <source src="memory3.mp4">
    </video>
    <div class="content">
        <h1>If you ever feel like talking again…</h1>
        <p>I’ll be here.</p>
    </div>
</div>

<script>
const reels = document.querySelectorAll(".reel");

let paused = false;

window.addEventListener("wheel", () => paused = true);
window.addEventListener("touchstart", () => paused = true);
window.addEventListener("keydown", () => paused = true);

function scrollToReel(index){
    reels[index].scrollIntoView({
        behavior:"smooth",
        block:"start"
    });
}

// 👉 FIRST VIDEO CONTROLS (IMPORTANT CHANGE)
const firstVideo = document.getElementById("firstVideo");

firstVideo.addEventListener("loadedmetadata", () => {
    firstVideo.play();

    // wait for video to END → then go next immediately
    firstVideo.addEventListener("ended", () => {
        scrollToReel(1);
    });
});

// fallback auto scroll for rest of reels
function getCurrentReelIndex() {
    let index = 0;

    reels.forEach((reel, i) => {
        const rect = reel.getBoundingClientRect();
        if (rect.top >= -10 && rect.top <= 10) {
            index = i;
        }
    });

    return index;
}

function goToNextReel(){
    if(paused) return;

    const current = getCurrentReelIndex();
    const next = (current + 1) % reels.length;

    scrollToReel(next);
}

// start normal auto-scroll AFTER first video ends
setTimeout(() => {
    setInterval(goToNextReel, 5000);
}, 2000);

</script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>I'm Sorry Vanshu</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:'Inter', sans-serif;
    background:black;

    overflow-y:scroll;

    scroll-snap-type:y mandatory;
    scroll-behavior:smooth;

    overscroll-behavior-y:none;
}

/* EACH REEL */
.reel{
    position:relative;
    height:100vh;
    width:100%;

    scroll-snap-align:start;
    scroll-snap-stop:always;

    display:flex;
    align-items:center;
    justify-content:center;

    overflow:hidden;

    transition:transform 0.25s ease;
}

/* VIDEO + IMAGE */
.reel video,
.reel img{
    position:absolute;

    top:0;
    left:0;

    width:100%;
    height:100%;

    object-fit:cover;

    z-index:-2;

    transform:scale(1.1);

    animation:slowZoom 12s ease-in-out infinite alternate;
}

/* special fit image */
.reel.fit img{
    object-fit:contain;
    background:black;

    transform:none;
    animation:none;
}

@keyframes slowZoom{
    from{ transform:scale(1.1); }
    to{ transform:scale(1.2); }
}

/* overlay */
.reel::after{
    content:'';

    position:absolute;

    top:0;
    left:0;

    width:100%;
    height:100%;

    background: radial-gradient(
        circle at center,
        rgba(0,0,0,0.2),
        rgba(0,0,0,0.75)
    );

    z-index:-1;
}

/* TEXT */
.content{
    color:white;
    text-align:center;

    padding:25px;
    max-width:90%;

    opacity:0.95;

    letter-spacing:0.5px;

    text-shadow:0 2px 12px rgba(0,0,0,0.8);

    animation:fadeUp 1s ease;
}

/* FIX: hidden initially so it doesn't appear before video loads */
.first-content{
    opacity:0;
    transform:translateY(20px);
}

.content h1{
    font-size:3.8rem;
    margin-bottom:15px;
    font-weight:600;
}

.content p{
    font-size:1.5rem;
    line-height:1.7;
}

@keyframes fadeUp{
    from{
        opacity:0;
        transform:translateY(30px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}

/* FINAL SLIDE */
.end-content{
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:14px;
}

.end-content h1{
    font-size:3.4rem;
    font-weight:600;
    letter-spacing:0.6px;
    margin-bottom:6px;
}

.end-content .subtext{
    font-size:1.9rem;
    opacity:0.92;
}

.reel:last-child::after{
    background:rgba(0,0,0,0.78);
}

/* MOBILE */
@media(max-width:768px){

    .content h1{ font-size:2.6rem; }
    .content p{ font-size:1.2rem; }

    .end-content h1{ font-size:2.4rem; }
    .end-content .subtext{ font-size:1.3rem; }
}

</style>
</head>

<body>

<!-- REEL 1 -->
<div class="reel">

    <video id="firstVideo" muted playsinline preload="auto" autoplay>
        <source src="Memory1.mp4" type="video/mp4">
    </video>

    <div class="content first-content">

        <h1>I'm Sorry</h1>
        <p>I know I hurt you.</p>
        <p>And I regret it deeply.</p>

    </div>

</div>

<!-- REELS -->
<div class="reel"><img src="1.jpeg"><div class="content"><p>Every picture reminds me of you.</p></div></div>
<div class="reel fit"><img src="2.jpeg"><div class="content"><p>I wish I handled things better.</p></div></div>
<div class="reel"><img src="3.jpeg"><div class="content"><p>I never wanted to hurt you.</p></div></div>
<div class="reel"><img src="4.jpeg"><div class="content"><p>Every moment still stays with me.</p></div></div>
<div class="reel"><img src="5.jpeg"><div class="content"><p>I miss how things used to be.</p></div></div>
<div class="reel"><img src="6.jpeg"><div class="content"><p>I hope you’re doing okay.</p></div></div>

<!-- FINAL REEL -->
<div class="reel">

    <video autoplay muted loop playsinline preload="auto">
        <source src="memory3.mp4" type="video/mp4">
    </video>

    <div class="content end-content">

        <h1>If you ever feel like talking again…</h1>
        <p class="subtext">I’ll be here.</p>

    </div>

</div>

<script>

const reels = document.querySelectorAll(".reel");

let currentIndex = 0;
let isUserInteracting = false;

/* scroll to reel */
function goToReel(index){
    window.scrollTo({
        top: reels[index].offsetTop,
        behavior: "smooth"
    });
}

/* detect active reel */
function getCurrentReelIndex(){
    let closest = 0;
    let min = Infinity;

    reels.forEach((r, i) => {
        const d = Math.abs(r.getBoundingClientRect().top);
        if(d < min){
            min = d;
            closest = i;
        }
    });

    return closest;
}

/* auto next */
function nextReel(){
    if(isUserInteracting) return;

    currentIndex = getCurrentReelIndex();
    currentIndex = (currentIndex + 1) % reels.length;

    goToReel(currentIndex);
}

/* pause on interaction */
["touchstart","scroll"].forEach(evt => {
    window.addEventListener(evt, () => {
        isUserInteracting = true;

        clearTimeout(window.resumeTimer);
        window.resumeTimer = setTimeout(() => {
            isUserInteracting = false;
        }, 3000);
    }, { passive:true });
});

/* faster swipe timing */
setInterval(nextReel, 2400);

/* FIX: perfect sync for first reel */
const firstVideo = document.getElementById("firstVideo");
const firstContent = document.querySelector(".first-content");

/* ensure video starts immediately */
firstVideo.addEventListener("loadeddata", async () => {
    try {
        await firstVideo.play();

        // show text only after video actually starts rendering
        requestAnimationFrame(() => {
            setTimeout(() => {
                firstContent.style.opacity = "0.95";
                firstContent.style.transform = "translateY(0)";
            }, 150);
        });

    } catch(e) {}
});

firstVideo.addEventListener("ended", () => {
    goToReel(1);
    currentIndex = 1;
});

</script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>I'm Sorry Vanshu</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html, body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:black;
}

/* WRAPPER */
.wrapper{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
    background:black;
}

/* VIDEO */
video{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    object-fit:cover;
    background:black;
}

/* CONTENT */
.content{
    position:absolute;
    inset:0;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:20px;
    color:white;
    font-family: sans-serif;
    text-shadow:0 2px 10px rgba(0,0,0,0.8);
}

.content h1{
    font-size:2.5rem;
    margin-bottom:10px;
}

.content p{
    font-size:1.1rem;
}

/* TAP MESSAGE */
.tap-message{
    position:absolute;
    bottom:20px;
    left:50%;
    transform:translateX(-50%);
    color:white;
    font-size:14px;
    opacity:0.7;
}
</style>
</head>

<body>

<div class="wrapper">

    <video id="video" muted autoplay loop playsinline preload="auto">
        <source src="final.mp4" type="video/mp4">
    </video>

    <div class="content">
        <h1>I'm Sorry</h1>
        <p>I know I hurt you.</p>
        <p>And I regret it deeply.</p>
    </div>

    <div class="tap-message">
        Tap anywhere if video doesn't start
    </div>

</div>

<script>

const video = document.getElementById("video");

/* TRY PLAY */
async function playVideo(){
    try {
        video.muted = true;
        await video.play();
    } catch (e) {
        // autoplay blocked
    }
}

/* AUTO START */
window.addEventListener("load", playVideo);

/* USER GESTURE FALLBACK */
document.addEventListener("click", playVideo, { once:true });
document.addEventListener("touchstart", playVideo, { once:true });

/* RESUME ON RETURN */
document.addEventListener("visibilitychange", () => {
    if (!document.hidden) {
        video.play().catch(() => {});
    }
});

</script>

</body>
</html>

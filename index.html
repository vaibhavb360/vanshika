<!DOCTYPE html>
<html lang="en">
<head> <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>I'm Sorry Vanshu</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    height:100vh;
    overflow:hidden;
    font-family: 'Inter', sans-serif;
}

/* Background video */
.bg-video{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    object-fit:cover;
    z-index:-3;
}

/* Dark overlay */
body::after{
    content:'';
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background:rgba(0,0,0,0.45);
    z-index:-2;
}

/* Photo collage */
.collage{
    position:fixed;
    width:100%;
    height:100%;
    display:grid;
    grid-template-columns:repeat(3,1fr);
    grid-template-rows:repeat(2,1fr);
    z-index:-1;
}

.collage img{
    width:100%;
    height:100%;
    object-fit:cover;
    opacity:0.18;
    filter:contrast(1.2) brightness(0.7) saturate(0.9);
    border:1px solid rgba(255,255,255,0.08);
}

/* Front text */
.overlay{
    position:absolute;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    text-align:center;
    color:white;
    width:90%;
}

.overlay h1{
    font-size:3.4rem;
    font-weight:600;
    letter-spacing:1px;
    margin-bottom:20px;
    text-shadow:0 10px 30px rgba(0,0,0,0.5);
}

    .overlay p{
    font-size:1.2rem;
    line-height:1.8;
    padding:22px;
    border-radius:18px;

    background:rgba(0,0,0,0.35);
    backdrop-filter: blur(10px);

    border:1px solid rgba(255,255,255,0.08);
}

button{
    margin-top:25px;
    padding:12px 24px;
    border:none;
    border-radius:30px;
    background:#ff4d6d;
    color:white;
    font-size:1rem;
    cursor:pointer;
}

button:hover{
    background:#ff1e4d;
}

.hidden-message{
    margin-top:20px;
    font-size:1.1rem;
    color:#ffdede;

    opacity:0;
    transform:translateY(10px);
    transition:all 2s ease-in-out;
}

@media(max-width:768px){
    .overlay h1{
        font-size:2rem;
    }

    .overlay p{
        font-size:1rem;
    }
}
</style>
</head>

<body>
    <video autoplay muted loop playsinline class="bg-video">
    <source src="vdd.mp4" type="video/mp4">
</video>

<div class="collage">
    <img src="1.jpeg">
    <img src="2.jpeg">
    <img src="3.jpeg">
    <img src="4.jpeg">
    <img src="5.jpeg">
    <img src="6.jpeg">

</div>

<div class="overlay">
    <h1>I'm Sorry </h1>

    <p>
        I know I hurt you, and I regret it deeply.
        Every picture here reminds me how important you are to me.
        I can't change what happened, but I truly want to make things right and treat you better
      
    </p>

   

    <div class="hidden-message" id="message">
        You really do mean a lot to me.
    </div>
</div>

<script>
window.onload = function(){
    setTimeout(function(){
        const msg = document.getElementById("message");
        msg.style.opacity = "1";
        msg.style.transform = "translateY(0)";
    }, 3000);
}
</script>

</body>
</html>

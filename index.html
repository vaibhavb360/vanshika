<!DOCTYPE html>
<html lang="en">
<head>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>I'm Sorry Vanshu</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:'Inter', sans-serif;
    background:black;
    overflow:hidden; /* IMPORTANT: disable scroll */
}

/* VIEWPORT */
.wrapper{
    position:relative;
    height:100vh;
    width:100vw;
    overflow:hidden;
}

/* SLIDER TRACK */
.track{
    height:100%;
    width:100%;
    transition: transform 0.9s ease;
}

/* REELS */
.reel{
    height:100vh;
    width:100vw;
    position:relative;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
}

/* MEDIA */
.reel video,
.reel img{
    position:absolute;
    top:0;
    left:0;
    width:100%;
    height:100%;
    object-fit:cover;
    z-index:-2;
    transform:scale(1.1);
    animation:slowZoom 12s ease-in-out infinite alternate;
}

@keyframes slowZoom{
    from{ transform:scale(1.1); }
    to{ transform:scale(1.2); }
}

/* OVERLAY */
.reel::after{
    content:'';
    position:absolute;
    inset:0;
    background: radial-gradient(circle, rgba(0,0,0,0.2), rgba(0,0,0,0.75));
    z-index:-1;
}

/* TEXT */
.content{
    color:white;
    text-align:center;
    padding:25px;
    text-shadow:0 2px 12px rgba(0,0,0,0.8);
}

.content h1{
    font-size:3rem;
}

.content p{
    font-size:1.4rem;
}

.end-content{
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:12px;
}

@media(max-width:768px){
    .content h1{font-size:2.4rem;}
    .content p{font-size:1.1rem;}
}

</style>
</head>

<body>

<div class="wrapper">
    <div class="track" id="track">

        <div class="reel">
            <video id="firstVideo" muted playsinline autoplay loop>
                <source src="Memory1.mp4">
            </video>
            <div class="content">
                <h1>I'm Sorry</h1>
                <p>I know I hurt you.</p>
            </div>
        </div>

        <div class="reel"><img src="1.jpeg"><div class="content"><p>Every picture reminds me of you.</p></div></div>
        <div class="reel"><img src="2.jpeg"><div class="content"><p>I wish I handled things better.</p></div></div>
        <div class="reel"><img src="3.jpeg"><div class="content"><p>I never wanted to hurt you.</p></div></div>
        <div class="reel"><img src="4.jpeg"><div class="content"><p>Every moment still stays with me.</p></div></div>
        <div class="reel"><img src="5.jpeg"><div class="content"><p>I miss how things used to be.</p></div></div>
        <div class="reel"><img src="6.jpeg"><div class="content"><p>I hope you’re doing okay.</p></div></div>

        <div class="reel">
            <video id="lastVideo" muted playsinline autoplay loop>
                <source src="memory3.mp4">
            </video>

            <div class="content end-content">
                <h1>If you ever feel like talking again…</h1>
                <p>I’ll be here.</p>
            </div>
        </div>

    </div>
</div>

<script>

const track = document.getElementById("track");
const reels = document.querySelectorAll(".reel");

let index = 0;
let locked = false;

/* MOVE SLIDE (THIS IS THE KEY FIX) */
function goTo(i){
    if(i < 0 || i >= reels.length) return;

    index = i;
    locked = true;

    track.style.transform = `translateY(-${i * 100}vh)`;

    setTimeout(() => {
        locked = false;
    }, 900);
}

/* AUTO SCROLL (NOW 100% RELIABLE) */
function next(){
    if(locked) return;
    if(index >= reels.length - 1) return;

    goTo(index + 1);
}

setInterval(next, 3500);

/* TOUCH PAUSE */
window.addEventListener("touchstart", () => {
    locked = true;
    setTimeout(() => locked = false, 4000);
}, { passive:true });

/* autoplay fix */
window.addEventListener("load", async () => {

    const v1 = document.getElementById("firstVideo");
    const v2 = document.getElementById("lastVideo");

    try {
        await v1.play();
        await v2.play();
    } catch(e){}

    goTo(0);
});

</script>

</body>
</html>

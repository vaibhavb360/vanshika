<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>I'm Sorry Vanshu</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,
body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:black;

    -webkit-touch-callout:none;
    -webkit-user-select:none;
    user-select:none;

    touch-action:manipulation;
}

/* FULLSCREEN WRAPPER */
.wrapper{
    position:fixed;
    inset:0;

    width:100%;
    height:100%;

    background:black;
    overflow:hidden;
}

/* VIDEO */
video{
    position:absolute;
    inset:0;

    width:100%;
    height:100%;

    object-fit:cover;
    object-position:center;

    background:black;

    z-index:1;
}

/* OVERLAY */
.overlay{
    position:absolute;
    inset:0;

    background:
    radial-gradient(
        circle,
        rgba(0,0,0,0.15),
        rgba(0,0,0,0.75)
    );

    z-index:2;
}

/* TEXT */
.content{
    position:absolute;
    inset:0;

    display:flex;
    flex-direction:column;

    align-items:center;
    justify-content:center;

    padding:30px;

    text-align:center;

    color:white;

    font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    sans-serif;

    z-index:3;

    text-shadow:
    0 2px 12px rgba(0,0,0,0.9);
}

.content h1{
    font-size:3rem;
    margin-bottom:14px;
}

.content p{
    font-size:1.2rem;
    line-height:1.6;
}

/* TAP MESSAGE */
.tap-message{
    position:absolute;

    bottom:28px;
    left:50%;

    transform:translateX(-50%);

    color:white;

    font-size:14px;
    font-family:sans-serif;

    opacity:0.75;

    z-index:5;

    animation:pulse 2s infinite;
}

@keyframes pulse{

    0%{
        opacity:0.3;
    }

    50%{
        opacity:0.9;
    }

    100%{
        opacity:0.3;
    }

}

/* MOBILE */
@media(max-width:768px){

    .content h1{
        font-size:2.1rem;
    }

    .content p{
        font-size:1rem;
    }

}

</style>
</head>

<body>

<div class="wrapper">

    <!-- VIDEO -->
    <video
        id="video"
        muted
        autoplay
        playsinline
        webkit-playsinline
        preload="auto">

        <!-- REPLACE WITH FINAL VIDEO -->
        <source
        src="final.mp4"
        type="video/mp4">

    </video>

    <!-- DARK OVERLAY -->
    <div class="overlay"></div>

    <!-- TEXT -->
    <div class="content">

        <h1>I'm Sorry</h1>

        <p>
            I know I hurt you.
        </p>

        <p>
            And I regret it deeply.
        </p>

    </div>

    <!-- TAP MESSAGE -->
    <div class="tap-message">
        Tap anywhere if video doesn't start
    </div>

</div>

<script>

const video =
document.getElementById("video");

/* FORCE VIDEO PLAY */
function forcePlay(){

    const playPromise =
    video.play();

    if(playPromise !== undefined){

        playPromise
        .then(() => {

            console.log("Video playing");

        })
        .catch(() => {

            console.log("Autoplay blocked");

        });

    }

}

/* LOAD */
window.addEventListener(
    "load",
    () => {

        video.muted = true;

        forcePlay();

    }
);

/* INSTAGRAM FIX */
document.addEventListener(
    "touchstart",
    forcePlay,
    { once:true }
);

document.addEventListener(
    "click",
    forcePlay,
    { once:true }
);

/* PAGE VISIBILITY FIX */
document.addEventListener(
    "visibilitychange",
    () => {

        if(!document.hidden){

            forcePlay();

        }

    }
);

/* PREVENT PAUSE */
video.addEventListener(
    "pause",
    () => {

        forcePlay();

    }
);

</script>

</body>
</html>

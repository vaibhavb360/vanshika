<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>I'm Sorry Vanshu</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    height:100vh;
    overflow:hidden;
    font-family:Arial, sans-serif;
}

/* Background collage */
.collage{
    position:fixed;
    width:100%;
    height:100%;
    display:grid;
    grid-template-columns:repeat(3,1fr);
    grid-template-rows:repeat(3,1fr);
}

.collage img{
    width:100%;
    height:100%;
    object-fit:cover;
    filter:brightness(40%);
}

/* Front text */
.overlay{
    position:absolute;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    text-align:center;
    color:white;
    width:90%;
}

.overlay h1{
    font-size:3rem;
    margin-bottom:20px;
}

.overlay p{
    font-size:1.2rem;
    line-height:1.8;
    background:rgba(0,0,0,0.5);
    padding:20px;
    border-radius:20px;
}

button{
    margin-top:25px;
    padding:12px 24px;
    border:none;
    border-radius:30px;
    background:#ff4d6d;
    color:white;
    font-size:1rem;
    cursor:pointer;
}

button:hover{
    background:#ff1e4d;
}

.hidden-message{
    margin-top:20px;
    display:none;
    font-size:1.1rem;
    color:#ffdede;
}

@media(max-width:768px){
    .overlay h1{
        font-size:2rem;
    }

    .overlay p{
        font-size:1rem;
    }
}
</style>
</head>

<body>

<div class="collage">
    <img src="1.jpg">
    <img src="2.jpg">
    <img src="3.jpg">
    <img src="4.jpg">
    <img src="5.jpg">
    <img src="6.jpg">
    <img src="7.jpg">
    <img src="8.jpg">
    <img src="9.jpg">
</div>

<div class="overlay">
    <h1>I'm Sorry </h1>

    <p>
        I know I hurt you, and I regret it deeply.
        Every picture here reminds me how important you are to me.
        I can't change what happened, but I truly want to make things right.
      
    </p>

    <button onclick="showMessage()">
        Tap Here
    </button>

    <div class="hidden-message" id="message">
        You really do mean a lot to me.
    </div>
</div>

<script>
function showMessage(){
    document.getElementById("message").style.display = "block";
}
</script>

</body>
</html>
